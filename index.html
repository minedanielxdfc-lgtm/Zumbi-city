let sel=null,off=[0,0];
function place(e,l,t,s){e.style.left=l+'px';e.style.top=t+'px';e.style.right=e.style.bottom='auto';e.style.transformOrigin='top left';e.style.transform='scale('+s+')';e.dataset.s=s}

document.querySelectorAll('.h').forEach(e=>e.addEventListener('touchstart',ev=>{if(!G.edit)return;ev.preventDefault();ev.stopPropagation();sel=e;const r=e.getBoundingClientRect();place(e,r.left,r.top,+e.dataset.s||1);
off=[ev.touches[0].clientX-r.left,ev.touches[0].clientY-r.top];$('rz').value=e.dataset.s},{passive:false}));

const PC=!('ontouchstart' in window)&&matchMedia('(pointer:fine)').matches;if(PC)document.body.classList.add('pc');
const K={w:0,a:0,s:0,d:0},kmap=c=>{const k=S.keys;return c==k.fwd||c=='ArrowUp'?'w':c==k.back||c=='ArrowDown'?'s':c==k.left||c=='ArrowLeft'?'a':c==k.right||c=='ArrowRight'?'d':null};
const live=()=>!G.lobby&&!G.paused&&!G.edit&&!G.mapo;
function kmove(){if(joy)return;let x=K.d-K.a,y=K.s-K.w;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}G.jx=x;G.jy=y}
function swapW(){const i=G.own.indexOf(G.cur);G.cur=G.own[(i+1)%G.own.length];G.rl=0;setGun()}
addEventListener('keydown',e=>{if(bindK){e.preventDefault();if(e.code!='Escape'){for(const a in S.keys)if(S.keys[a]==e.code&&a!=bindK)S.keys[a]=S.keys[bindK];S.keys[bindK]=e.code;saveS()}bindK=null;rKeys();return}
if(e.target&&e.target.tagName=='INPUT')return;const c=e.code;if(c==S.keys.sprint)G.spr=1;
const mk=kmap(c);if(mk){e.preventDefault();K[mk]=1;kmove();return}
if(e.repeat)return;
if(c=='Escape'||c=='KeyP'){if(G.bag){closeBag();return}if(G.mapo){closeMap();return}if(G.paused&&!G.lobby&&!G.edit&&!$('pm').classList.contains('hid')&&!$('bres').classList.contains('hid'))$('bres').onclick();else if(live())doPause();return}
if(c==S.keys.map&&!G.lobby&&!G.paused&&!G.edit){e.preventDefault();G.mapo?closeMap():openMap();return}
if(c==S.keys.bag){e.preventDefault();if(G.bag)closeBag();else if(live())openBag();return}
if(!live())return;
if(/^Digit[1-4]$/.test(c)){const n=+c[5]-1,t=n==3?0:slotL()[n];if(t!==undefined){G.cur=t;G.rl=0;setGun()}e.preventDefault();return}
const k=S.keys;if(c==k.reload)reload();else if(c==k.swap)swapW();else if(c==k.act)act();else if(c==k.bd)useBd();else if(c==k.kit)useKit();else if(c==k.gren)throwG();else if(c==k.cam)togCam();else if(c==k.lock)togLock();else if(c==k.jump)jump();else if(c==k.pbar)placeB('b');else if(c==k.pwir)placeB('w');else return;e.preventDefault()});
addEventListener('keyup',e=>{if(e.code==S.keys.sprint)G.spr=0;const k=kmap(e.code);if(k){K[k]=0;kmove()}});
addEventListener('blur',()=>{K.w=K.a=K.s=K.d=0;kmove();G.fire=0;G.spr=0});
cv.addEventListener('click',()=>{if(PC&&live()&&!G.ul&&!document.pointerLockElement)try{cv.requestPointerLock()}catch(e){}});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==cv||!live())return;G.yaw-=e.movementX*G.msens*sf();G.pitch=Math.max(-1,Math.min(.9,G.pitch-e.movementY*G.msens*sf()*(S.inv?-1:1)))});
cv.addEventListener('mousedown',e=>{const ok=(document.pointerLockElement===cv||G.ul)&&live();if(e.button==0&&ok)G.fire=1;if(e.button==2&&ok)G.ads=1});
addEventListener('mouseup',e=>{if(e.button==0)G.fire=0;if(e.button==2)G.ads=0});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(live()&&document.pointerLockElement===cv)swapW()},{passive:true});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&live()&&!G.ul)doPause()});

/* ===== v6: modelos de arma, chao, mochila, mira ===== */
function gunM(w){const g=new THREE.Group(),c=w.c,d=0x18181c,L=w.L||.5,wd=0x4a3320;

if(!w.m){box(0,0,-.2,.04,.06,.45,0xcfd3d8,g);box(0,-.02,.1,.06,.07,.2,0x2a2a2a,g);fl().position.z=-.5;return g}
if(w.k=='p'){box(0,.02,-L/2+.15,.07,.1,L,c,g);box(0,-.1,.08,.065,.2,.1,d,g);box(0,-.02,-L+.05,.04,.04,.1,d,g)}
else{box(0,0,-L/2+.2,.08,.1,L,c,g);box(0,0,-L+.1,.035,.035,.25,d,g);box(0,-.14,.12,.065,.2,.1,d,g);box(0,-.12,-.1,.06,.2,.09,d,g);box(0,-.02,.4,.07,.12,.3,w.t=='u'?d:wd,g);
if(w.t=='s'){box(0,.1,-.1,.07,.07,.4,0x111111,g);box(0,.1,-.32,.1,.1,.06,0x223344,g)}
if(w.t=='sg')box(0,-.07,-L+.25,.1,.07,.35,wd,g);
if(w.t=='l')box(0,-.16,-.1,.2,.2,.2,0x44502f,g);
if(w.t=='r')box(0,.08,-.1,.04,.05,.3,d,g)}
fl().position.z=-L-.15;return g}
const slotL=()=>[G.own.filter(i=>W[i].k=='b')[0],G.own.filter(i=>W[i].k=='b')[1],G.own.filter(i=>W[i].k=='p')[0]];
function gItem(i,x,z,a){const m=new THREE.Group(),w=W[i],gm=gunM(w);gm.position.y=.75;gm.scale.setScalar(1.6);m.add(gm);box(0,.08,0,1.1,.08,1.1,w.k=='p'?0x44aaff:0xffa000,m);m.position.set(x,0,z);sc.add(m);
const o={x,z,t:'wp',w:i,a:a||{mag:mag(i),res:mag(i)*2},on:1,rt:0,m,dyn:1};I.push(o);return o}

function renderBag(){const l=$('bpl'),mk=(t,bs)=>{const r=document.createElement('div');r.className='kr';const s=document.createElement('span');s.textContent=t;r.appendChild(s);for(const b of bs){const e=document.createElement('button');e.textContent=b[0];e.onclick=b[1];r.appendChild(e)}l.appendChild(r)};

const s=document.createElement('div');s.textContent='\ud83e\ude79 '+G.bd+' \u00b7 \u2795 '+G.kit+' \u00b7 \ud83d\udca3 '+G.gr+' \u00b7 faca sempre com voc\u00ea';l.appendChild(s)}
